name: vidsave
description: Premium video downloader (Flutter, MVVM, SQLite).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  video_player: ^2.9.2
  gal: ^2.3.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  video_thumbnail: ^0.5.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
